name: CI

# The publish workflow only runs on a tag, which is a bad time to find out that the README copies
# have drifted or that the demo build is broken. This is the same gate, run on every push.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: corepack enable pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test (v8 coverage; the thresholds in angular.json are enforced)
        run: pnpm run test

      - name: Build the library
        run: pnpm run build

      - name: Build the demo and check the distribution
        run: |
          pnpm run build:demo
          pnpm run check:dist
