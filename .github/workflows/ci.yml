name: CI

# The publish workflow only runs on a tag, which is a bad time to find out that the README copies
# have drifted or that the demo build is broken. This is the same gate, run on every push.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: corepack enable pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # The probe tsconfig maps `ng-signal-request` to `dist/signal-request` so the size probes
      # measure the built package. Type-aware ESLint reads that tsconfig, so the library has to be
      # built before linting; otherwise the probe imports are unresolved on a clean checkout.
      - name: Build the library
        run: pnpm run build

      - name: Lint (angular-eslint + typescript-eslint strict-type-checked)
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Test (v8 coverage; the thresholds in angular.json are enforced)
        run: pnpm run test

      - name: Check the 0.1.0 type compatibility fixture
        run: pnpm run check:types-compat

      - name: Check the durable-queue type fixture
        run: pnpm run check:types-queue

      - name: Build the demo and check the distribution
        run: |
          pnpm run build:demo
          pnpm run check:dist

  # Kept out of `verify` because it needs a browser download. It drives two production builds - the
  # demo (offline path) and the durable-queue app - and builds both itself: see
  # e2e/playwright.config.ts and the two `webServer` entries in it.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: corepack enable pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser checks (offline path and durable queue)
        run: pnpm run test:e2e
